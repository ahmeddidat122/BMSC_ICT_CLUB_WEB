<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/images/club_logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0a0a1a" />
		<link rel="manifest" crossorigin="use-credentials" href="%sveltekit.assets%/manifest.webmanifest" />

		<!-- Preload critical background images -->
		<link rel="preload" as="image" href="%sveltekit.assets%/images/background.webp" fetchpriority="high" />
		<link rel="preload" as="image" href="%sveltekit.assets%/images/circuit-bg.webp" fetchpriority="high" />

		<link rel="apple-touch-icon" href="%sveltekit.assets%/images/club_logo.png" />
		<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
		<link rel="dns-prefetch" href="https://plausible.io" />
		<link rel="preconnect" href="https://bmsc-ict-club.supabase.co" crossorigin />

		<title>BMSC ICT Club, Bogura</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-dark text-gray-200">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
